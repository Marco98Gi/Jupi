<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d46bff">
<title>X Jupi &lt;3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #c76bff;
    --sky-mid: #f08be6;
    --sky-bot: #ffb3e6;
    --hill-far: #ff8fd2;
    --hill-near: #ff5db8;
    --ink: #2a0a3a;
    --title: #c4155f;
    --title-shadow: #ffd6ee;
    --pink: #ff2d87;
    --pink-deep: #8a0b4a;
    --mint: #dffbff;
    --panel: #fff0fa;
    --cloud: #fff4fd;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky-top: #7a3bc0;
      --sky-mid: #b3489f;
      --sky-bot: #d968b4;
      --hill-far: #c24a96;
      --hill-near: #a82d78;
      --panel: #ffe3f6;
      --cloud: #f3d3ee;
    }
  }
  :root[data-theme="dark"] {
    --sky-top: #7a3bc0;
    --sky-mid: #b3489f;
    --sky-bot: #d968b4;
    --hill-far: #c24a96;
    --hill-near: #a82d78;
    --panel: #ffe3f6;
    --cloud: #f3d3ee;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    height: 100%;
    background: var(--sky-mid);
    font-family: 'Press Start 2P', 'Courier New', monospace;
    color: var(--ink);
    overflow-x: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .world {
    position: fixed;
    inset: 0;
    background: linear-gradient(var(--sky-top), var(--sky-mid) 55%, var(--sky-bot));
    z-index: 0;
    overflow: hidden;
  }
  .hill {
    position: absolute;
    left: 0; right: 0; bottom: 0;
  }
  .hill.far {
    height: 26%;
    background: var(--hill-far);
    clip-path: polygon(0 55%, 8% 55%, 8% 40%, 20% 40%, 20% 25%, 36% 25%, 36% 40%, 52% 40%, 52% 55%, 66% 55%, 66% 35%, 82% 35%, 82% 50%, 100% 50%, 100% 100%, 0 100%);
  }
  .hill.near {
    height: 17%;
    background: var(--hill-near);
    clip-path: polygon(0 45%, 14% 45%, 14% 25%, 30% 25%, 30% 45%, 48% 45%, 48% 60%, 70% 60%, 70% 30%, 88% 30%, 88% 50%, 100% 50%, 100% 100%, 0 100%);
  }
  .cloud {
    position: absolute;
    height: 14px;
    background: var(--cloud);
    box-shadow: 14px -14px 0 var(--cloud), 28px -14px 0 var(--cloud), 42px 0 0 var(--cloud);
    width: 56px;
    opacity: .9;
  }
  .cloud.c1 { top: 16%; left: -10px; }
  .cloud.c2 { top: 31%; right: 18px; transform: scale(.8); }
  .cloud.c3 { top: 64%; left: 24px; transform: scale(.65); opacity: .7; }

  .hearts { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .heart {
    position: absolute;
    bottom: -30px;
    width: 21px; height: 18px;
    animation: rise linear forwards;
  }
  @keyframes rise {
    from { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: .9; }
    to { transform: translateY(-110vh) translateX(var(--dx, 0)); opacity: 0; }
  }

  .app {
    position: relative;
    z-index: 2;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px 28px;
  }
  .screen {
    display: none;
    width: 100%;
    max-width: 420px;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 22px;
  }
  .screen.on { display: flex; }

  .avatar {
    width: 112px; height: 112px;
    background: var(--ink);
    border: 4px solid #fff0fa;
    box-shadow: 0 0 0 4px var(--pink), 0 0 0 8px var(--ink), 6px 8px 0 8px rgba(42,10,58,.25);
    display: grid;
    place-items: center;
    margin-bottom: 4px;
  }
  .avatar svg { width: 84px; height: 78px; shape-rendering: crispEdges; image-rendering: pixelated; }

  h1 {
    margin: 0;
    font-weight: 400;
    font-size: clamp(17px, 6.2vw, 26px);
    line-height: 1.55;
    color: var(--title);
    text-shadow: 3px 3px 0 var(--title-shadow);
    overflow-wrap: anywhere;
  }
  .sub {
    margin: 0;
    font-size: 10px;
    line-height: 1.8;
    color: var(--ink);
    background: var(--panel);
    padding: 8px 10px;
    border: 3px solid var(--ink);
  }

  .btn {
    font-family: inherit;
    font-size: 13px;
    line-height: 1.3;
    color: var(--mint);
    background: var(--pink);
    border: 4px solid var(--ink);
    padding: 14px 18px;
    cursor: pointer;
    box-shadow: inset -4px -4px 0 rgba(0,0,0,.22), inset 4px 4px 0 rgba(255,255,255,.35), 0 5px 0 var(--ink);
    transition: transform .08s;
    touch-action: manipulation;
  }
  .btn:active { transform: translateY(3px); box-shadow: inset -4px -4px 0 rgba(0,0,0,.22), inset 4px 4px 0 rgba(255,255,255,.35), 0 2px 0 var(--ink); }
  .btn:focus-visible, .act:focus-visible, input:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }
  .btn:disabled { background: #c9a3ba; color: #f2e4ec; cursor: not-allowed; }
  .btn.no {
    font-size: 10px;
    background: var(--panel);
    color: var(--pink-deep);
    padding: 12px 12px;
    max-width: 190px;
    position: relative;
    z-index: 5;
    transition: transform .18s steps(4);
  }
  .choices {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 18px;
    width: 100%;
    min-height: 80px;
  }
  #yes { transition: font-size .15s steps(3), padding .15s steps(3); }

  input[type="date"],
  input[type="time"] {
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--panel);
    border: 4px solid var(--ink);
    padding: 14px 12px;
    width: 100%;
    max-width: 300px;
    text-align: center;
    box-shadow: 0 5px 0 var(--ink);
    color-scheme: light;
  }

  .field {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 300px;
  }
  .field span {
    font-size: 11px;
    line-height: 1.6;
    color: var(--ink);
    background: var(--panel);
    padding: 8px 12px;
    border: 3px solid var(--ink);
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: 100%;
  }
  .act {
    font-family: inherit;
    font-size: 10px;
    line-height: 1.6;
    color: var(--ink);
    background: var(--panel);
    border: 4px solid var(--ink);
    padding: 16px 8px;
    min-height: 64px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--ink);
    overflow-wrap: anywhere;
    touch-action: manipulation;
  }
  .act:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .act[aria-pressed="true"] {
    background: var(--pink);
    color: var(--mint);
    transform: translateY(3px);
    box-shadow: 0 2px 0 var(--ink);
  }

  .ticket {
    width: 100%;
    background: var(--panel);
    border: 4px solid var(--ink);
    box-shadow: 0 5px 0 var(--ink);
    padding: 18px 14px;
    font-size: 11px;
    line-height: 2;
    text-align: left;
  }
  .ticket b { font-weight: 400; color: var(--title); display: block; }
  .ticket span { display: block; margin-bottom: 8px; overflow-wrap: anywhere; }
  .ticket span:last-child { margin-bottom: 0; }

  @media (prefers-reduced-motion: reduce) {
    .heart { display: none; }
    * { transition: none !important; }
  }
  @media (max-height: 640px) {
    .avatar { width: 88px; height: 88px; }
    .avatar svg { width: 64px; height: 60px; }
    .screen { gap: 16px; }
  }
</style>
</head>
<body>
<div class="world" aria-hidden="true">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="hill far"></div><div class="hill near"></div>
</div>
<div class="hearts" id="hearts" aria-hidden="true"></div>

<main class="app">

  <section class="screen on" id="s1">
    <div class="avatar"><span id="cat1"></span></div>
    <h1>Ciao Jupi&lt;3,<br>Ti va di uscire con me?</h1>
    <div class="choices" id="choices">
      <button class="btn" id="yes" type="button">Sì</button>
      <button class="btn no" id="no" type="button">No</button>
    </div>
  </section>

  <section class="screen" id="s2">
    <div class="avatar"><span id="cat2"></span></div>
    <h1>Scegli giorno e ora</h1>
    
    <label class="field"><span>Scegli il giorno</span><input type="date" id="date" aria-label="Giorno dell'appuntamento"></label>
    <label class="field"><span>A che ora?</span><input type="time" id="time" aria-label="Ora dell'appuntamento"></label>
    <button class="btn" id="next2" type="button" disabled>Avanti</button>
  </section>

  <section class="screen" id="s3">
    <div class="avatar"><span id="cat3"></span></div>
    <h1>Cosa ti va di fare?</h1>
    <div class="grid" id="grid"></div>
    <button class="btn" id="next3" type="button" disabled>Confermo!</button>
  </section>

  <section class="screen" id="s4">
    <div class="avatar"><span id="cat4"></span></div>
    <h1>È un appuntamento!</h1>
    <div class="ticket">
      <span><b>Giorno</b><i id="outDate" style="font-style:normal"></i></span>
      <span><b>Ora</b><i id="outTime" style="font-style:normal"></i></span>
      <span><b>Attività</b><i id="outAct" style="font-style:normal"></i></span>
    </div>
    <p class="sub">Fai uno screenshot e mandamelo!</p>
  </section>

</main>

<script>
(function () {
  // ---------- gattino pixel art ----------
  var COL = { '1': '#2a0a3a', '2': '#e6f9ff', '3': '#ff9ec7', '4': '#2a0a3a', '5': '#6ad0ff' };
  var W = 14, H = 13;

  function cat(mood) {
    var g = [];
    for (var y = 0; y < H; y++) { g.push([]); for (var x = 0; x < W; x++) g[y].push('.'); }
    function set(x, y, c) { if (x >= 0 && x < W && y >= 0 && y < H) g[y][x] = c; }
    // testa
    for (var y2 = 3; y2 <= 11; y2++) for (var x2 = 1; x2 <= 12; x2++) {
      if ((y2 === 3 || y2 === 11) && (x2 === 1 || x2 === 12)) continue;
      set(x2, y2, '2');
    }
    // orecchie
    [[2,1],[1,2],[2,2],[3,2],[11,1],[10,2],[11,2],[12,2]].forEach(function (p) { set(p[0], p[1], '2'); });
    set(2, 2, '3'); set(11, 2, '3');
    // guance
    [[2,8],[3,8],[10,8],[11,8]].forEach(function (p) { set(p[0], p[1], '3'); });
    // occhi e bocca
    var eyes = [], mouth = [];
    if (mood === 'happy') {
      eyes = [[3,7],[4,6],[5,7],[8,7],[9,6],[10,7]];
      mouth = [[5,9],[6,10],[7,10],[8,9]];
    } else if (mood === 'sad') {
      eyes = [[4,6],[4,7],[9,6],[9,7]];
      mouth = [[5,10],[6,9],[7,9],[8,10]];
      set(4, 8, '5'); set(4, 9, '5');
    } else if (mood === 'think') {
      eyes = [[4,5],[4,6],[9,5],[9,6]];
      mouth = [[6,10],[7,10]];
    } else {
      eyes = [[4,6],[4,7],[9,6],[9,7]];
      mouth = [[6,9],[7,9]];
    }
    eyes.concat(mouth).forEach(function (p) { set(p[0], p[1], '4'); });
    // contorno automatico
    var out = g.map(function (r) { return r.slice(); });
    for (var yy = 0; yy < H; yy++) for (var xx = 0; xx < W; xx++) {
      if (g[yy][xx] !== '.') continue;
      var n = [[1,0],[-1,0],[0,1],[0,-1]].some(function (d) {
        var ny = yy + d[1], nx = xx + d[0];
        return ny >= 0 && ny < H && nx >= 0 && nx < W && g[ny][nx] !== '.';
      });
      if (n) out[yy][xx] = '1';
    }
    var rects = '';
    for (var y3 = 0; y3 < H; y3++) for (var x3 = 0; x3 < W; x3++) {
      var c = out[y3][x3];
      if (c !== '.') rects += '<rect x="' + x3 + '" y="' + y3 + '" width="1.02" height="1.02" fill="' + COL[c] + '"/>';
    }
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Gattino">' + rects + '</svg>';
  }
  function setCat(id, mood) { document.getElementById(id).innerHTML = cat(mood); }
  setCat('cat1', 'neutral'); setCat('cat2', 'think'); setCat('cat3', 'neutral'); setCat('cat4', 'happy');

  // ---------- cuori ----------
  var HEART = '<svg viewBox="0 0 7 6" shape-rendering="crispEdges"><g fill="#ff2d87"><rect x="1" y="0" width="2" height="1"/><rect x="4" y="0" width="2" height="1"/><rect x="0" y="1" width="7" height="2"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="3" y="5" width="1" height="1"/></g></svg>';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var layer = document.getElementById('hearts');
  function spawnHeart(sizeMul) {
    if (reduce) return;
    var h = document.createElement('div');
    h.className = 'heart';
    h.innerHTML = HEART;
    var s = (sizeMul || 1) * (0.7 + Math.random() * 0.9);
    h.style.left = (Math.random() * 100) + '%';
    h.style.width = (21 * s) + 'px';
    h.style.height = (18 * s) + 'px';
    h.style.setProperty('--dx', ((Math.random() - 0.5) * 80) + 'px');
    h.style.animationDuration = (5 + Math.random() * 5) + 's';
    layer.appendChild(h);
    setTimeout(function () { if (h.parentNode) h.parentNode.removeChild(h); }, 11000);
  }
  function burst(n) { for (var i = 0; i < n; i++) setTimeout(function () { spawnHeart(1.2); }, i * 90); }
  setInterval(function () { spawnHeart(0.8); }, 2600);

  // ---------- schermate ----------
  function show(id) {
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('on'); });
    document.getElementById(id).classList.add('on');
    window.scrollTo(0, 0);
  }

  // ---------- schermata 1: Sì / No ----------
  var yes = document.getElementById('yes');
  var no = document.getElementById('no');
  var PHRASES = [
    'Dai ti prego :(',
    'Cuore spezzato </3',
    'Niente lupe :((',
    'Ancora Drop?',
    'Guarda il gattino!',
    'Mi stai facendo piangere',
    'Ultima possibilità!',
    'Non ce la faccio più'
  ];
  var count = 0, dx = 0, dy = 0;

  function dodge(e) {
    if (e && e.preventDefault) e.preventDefault();
    var level = Math.min(count + 1, 9);
    count++;
    // il Sì cresce
    yes.style.fontSize = (13 + level * 3) + 'px';
    yes.style.padding = (14 + level * 3) + 'px ' + (18 + level * 5) + 'px';
    // il gattino si rattrista
    setCat('cat1', count > 2 ? 'sad' : 'think');
    // cambia il testo del No
    no.textContent = PHRASES[Math.min(count - 1, PHRASES.length - 1)];
    // scappa
    requestAnimationFrame(function () {
      var r = no.getBoundingClientRect();
      var nx = r.left - dx, ny = r.top - dy;
      var yr = yes.getBoundingClientRect();
      var vw = window.innerWidth, vh = window.innerHeight;
      var m = 10, tx = 0, ty = 0, ok = false;
      for (var i = 0; i < 25 && !ok; i++) {
        tx = m + Math.random() * Math.max(1, vw - r.width - 2 * m);
        ty = 70 + Math.random() * Math.max(1, vh - r.height - 80);
        ok = !(tx < yr.right + 12 && tx + r.width > yr.left - 12 && ty < yr.bottom + 12 && ty + r.height > yr.top - 12);
      }
      dx = tx - nx; dy = ty - ny;
      no.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    });
  }
  no.addEventListener('pointerdown', dodge);
  no.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') dodge(e); });
  no.addEventListener('click', dodge);
  no.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') dodge(e); });
  window.addEventListener('resize', function () { no.style.transform = ''; dx = 0; dy = 0; });

  yes.addEventListener('click', function () {
    setCat('cat1', 'happy');
    burst(14);
    setTimeout(function () { show('s2'); }, 450);
  });

  // ---------- schermata 2: data ----------
  var dateEl = document.getElementById('date');
  var timeEl = document.getElementById('time');
  var next2 = document.getElementById('next2');
  var today = new Date();
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  dateEl.min = today.getFullYear() + '-' + pad(today.getMonth() + 1) + '-' + pad(today.getDate());
  function checkDT() { next2.disabled = !(dateEl.value && timeEl.value); }
  dateEl.addEventListener('input', checkDT);
  timeEl.addEventListener('input', checkDT);
  dateEl.addEventListener('change', checkDT);
  timeEl.addEventListener('change', checkDT);
  next2.addEventListener('click', function () { if (dateEl.value && timeEl.value) show('s3'); });

  // ---------- schermata 3: attività ----------
  var ACTS = ['McDonald\'s', 'Pizza', 'Passeggiata', 'Game of Thrones', 'Cinema', 'Ristorante', 'Gita', 'Sasso ;)'];
  var grid = document.getElementById('grid');
  var next3 = document.getElementById('next3');
  var chosen = null;
  ACTS.forEach(function (a) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'act';
    b.textContent = a;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () {
      grid.querySelectorAll('.act').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      chosen = a;
      next3.disabled = false;
    });
    grid.appendChild(b);
  });
  next3.addEventListener('click', function () {
    if (!chosen || !dateEl.value || !timeEl.value) return;
    var parts = dateEl.value.split('-');
    var d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    var txt = d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    document.getElementById('outDate').textContent = txt.charAt(0).toUpperCase() + txt.slice(1);
    document.getElementById('outTime').textContent = timeEl.value;
    document.getElementById('outAct').textContent = chosen;
    show('s4');
    burst(24);
  });
})();
</script>
</body>
</html>
